# 数据源配置 —— 本次留空，待人工填写（见 LOCAL_DEPLOYMENT_PLAN.md 附录 A）
#
# 约定：
#   1. 凭据一律写「环境变量名」，绝不写明文密钥。
#   2. 每接入一个源，必须补一组 P2.4 的 normalize 契约测试与 F.3 的使用前检查。
#   3. enabled: false 的源不会被 ingest 使用；未实现的源调用时抛 NotImplementedError。

sources:
  cn_etf:
    provider: tushare
    enabled: true
    datasets: [daily_bars, corporate_actions]
    credentials_env: TUSHARE_TOKEN
    calendar: XSHG
    notes: "境内 ETF 主入口。fund_daily(未复权)→bars_daily；fund_div→corporate_actions；fund_basic(market=E, 排除 REITs)→symbols。volume 单位=手(未换算)。沪、深共用 XSHG 日历（exchange-calendars 无 XSHE），SH/SZ 由 ticker 后缀区分。"

  hk_etf:
    provider: tushare       # 名单/元数据走 tushare（hk_basic）；日线行情走 futu
    enabled: false
    datasets: [daily_bars]
    credentials_env: TUSHARE_TOKEN
    calendar: XHKG
    notes: "HK 名单/元数据走 tushare hk_basic；行情由 futu 适配器供应（hk_daily 属单独付费权限，不用）。需核验代码映射、上市币种、不同币种柜台。"

  us_etf:
    provider: ""            # 例：yfinance
    enabled: false
    datasets: [daily_bars, corporate_actions]
    credentials_env: ""
    calendar: XNYS
    notes: "需核验退市与改代码、分红拆分、复权含义"

  fx:
    provider: ""
    enabled: false
    datasets: [daily_fx]
    credentials_env: ""
    notes: "内部统一：1 单位原币 = 多少基准货币；支持多基准并存，默认 CNY"

  macro:
    provider: ""            # 例：fred
    enabled: false
    datasets: [macro_series]
    credentials_env: ""
    notes: "宏观为一等数据，与行情同级维护"

  llm:
    provider: ""            # 例：openai / anthropic / ollama
    enabled: false
    credentials_env: ""
    notes: "供 x2strategy 使用；本地 ollama 可不需凭据"
