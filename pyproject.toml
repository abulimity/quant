[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[project]
name = "quant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "backtrader>=1.9.78.123",
    "bt>=1.2.3",
    "duckdb>=1.5.5",
    "exchange-calendars>=4.13.2",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "tzdata>=2026.4",
]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.uv.build-backend]
module-root = "src"
module-name = "quantlab"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
